# The build gate: builds the WSL generation, runs wsl-ubuntu-safe and evaluates the Mac (flake.nix).
# --no-update-lock-file keeps flake.lock as committed, so a green run is about this revision.
name: flake check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check --no-update-lock-file
