# Runs the entry scripts on clean runners, which `nix flake check` cannot do. Phase 1 needs no login, so
# a runner with no credential stands in for a fresh machine. The script's exit code gates a job;
# doctor.sh is evidence only. Not covered: anything Windows or WSL-specific (windows.ps1 is only parsed).
#
# Opt-in: a pull request runs it with the `bootstrap` label, or when it changes bootstrap*.sh,
# install-tools.sh, windows.ps1 or tools.list. Add the label when a change needs a real switch (a cask,
# a unit, a Mac package). Never a required check: a skip would then hold every pull request.
# `paths:` cannot express this - GitHub filters the `labeled` event by it too - so the `gate` job decides.
name: bootstrap check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'bootstrap') }}
          PR: ${{ github.event.pull_request.number }}
          # The header's list, as whole repository paths.
          ENTRY_SCRIPTS: 'bootstrap[^/]*\.sh|install-tools\.sh|windows\.ps1|tools\.list'
        run: |
          run=false
          if [ "$ACTION" = labeled ]; then
            if [ "$ADDED" = bootstrap ]; then run=true; fi
          elif [ "$LABELED" = true ]; then
            run=true
          else
            # Captured first: `grep -q` stopping early would fail a pipe under the step's pipefail.
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"
            if grep -qxE "$ENTRY_SCRIPTS" <<<"$files"; then run=true; fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  mac-bootstrap:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Apple Silicon, as hosts/darwin-mac.nix assumes.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles

      - name: bootstrap-mac.sh
        run: ./dotfiles/bootstrap-mac.sh

      - name: doctor.sh (evidence, not a gate)
        if: always()
        # A login zsh, so PATH is the one a human gets: nix-darwin sets it in /etc/zshenv and Home
        # Manager prepends ~/.local/bin from ~/.zshenv, and a bare `run:` step reads neither.
        run: zsh -lc './dotfiles/doctor.sh || true'

  wsl-bootstrap:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Not WSL: a plain Linux runner, the closest a hosted machine gets.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles

      - name: bootstrap.sh
        run: ./dotfiles/bootstrap.sh

      # windows.ps1 cannot run here, but pwsh on this image can parse it.
      - name: windows.ps1 parses
        run: |
          # shellcheck disable=SC2016  # $null and $e are PowerShell's, and must not expand here
          pwsh -NoProfile -Command '
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile("dotfiles/windows.ps1", [ref]$null, [ref]$e) | Out-Null
            if ($e) { $e | ForEach-Object { $_.Message }; exit 1 }
            "windows.ps1 parses"'

      - name: doctor.sh (evidence, not a gate)
        if: always()
        # A login bash: Home Manager's ~/.profile puts ~/.local/bin on PATH, and a bare `run:` skips it.
        run: bash -lc './dotfiles/doctor.sh || true'
